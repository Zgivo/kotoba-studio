[package]
name = "kotoba-studio"
version = "1.0.3"
description = "A focused Japanese vocabulary studio for macOS"
authors = ["Kotoba Studio"]
edition = "2021"

[lib]
name = "kotoba_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
